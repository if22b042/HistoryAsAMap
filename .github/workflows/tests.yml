name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.database }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        database: [sqlite]
        include:
          # Production runs on PostgreSQL, so run the whole suite there too.
          - python: "3.12"
            database: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haam
          POSTGRES_PASSWORD: haam
          POSTGRES_DB: haam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HAAM_ENV: testing
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://haam:haam@localhost:5432/haam_test' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes haam tests api

      - name: Run tests
        run: python -m pytest

  migrations:
    name: migrations match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haam
          POSTGRES_PASSWORD: haam
          POSTGRES_DB: haam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAAM_ENV: development
      SECRET_KEY: ci-only-secret
      AUTO_SETUP_DATABASE: "false"
      DATABASE_URL: postgresql://haam:haam@localhost:5432/haam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Apply all migrations
        run: flask --app haam db upgrade
      - name: Fail if a model change has no migration
        run: flask --app haam db check
      - name: Downgrade and upgrade again
        run: flask --app haam db downgrade base && flask --app haam db upgrade
