{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="page narrow">
  <div class="card centered">
    <i class="fas fa-compass error-icon" aria-hidden="true"></i>
    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.index') }}">Back to the map</a>
  </div>
</div>
{% endblock %}
